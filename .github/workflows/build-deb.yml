name: Build RootHide deb (Linux)

# Builds the native Terminal app and its Debian package entirely on Linux
# (roothide/theos), verifies the artifact, and publishes everything found in
# dist/ as a downloadable artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Also build on pull requests, so the deb artifact is downloadable before
  # the branch is merged into main.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential perl rsync fakeroot python3 xz-utils git curl ca-certificates

      - name: Clone roothide/theos
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS toolchain (Linux)
        run: |
          ARCH="$(uname -m)"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${ARCH}.tar.xz" \
            | tar -xJf - -C "$THEOS/toolchain/"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      - name: Install iOS SDK
        env:
          # install-sdk queries api.github.com for theos/sdks releases.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$THEOS/bin/install-sdk" latest
          ls -d "$THEOS"/sdks/iPhoneOS*.sdk

      - name: Run tests
        run: npm test

      - name: Build deb into dist/
        run: node scripts/build.mjs

      # dist/ may hold older packages too, so resolve the one this build just
      # produced instead of globbing the whole folder into the artifact.
      - name: Resolve the built package
        id: artifact
        run: |
          VERSION="$(sed -n 's/^Version: *//p' control)"
          FILE="dist/terminal-iphone-app-roothide_${VERSION}_iphoneos-arm64e.deb"
          test -f "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          sha256sum "$FILE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Show artifact
        run: |
          ls -la dist/
          dpkg-deb -f "${{ steps.artifact.outputs.file }}" Package Version Architecture

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-iphone-roothide-deb
          path: ${{ steps.artifact.outputs.file }}
          if-no-files-found: error
          retention-days: 30