name: Build iOS App (Roothide deb)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen dpkg ldid

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project TerminalIPHONE.xcodeproj \
            -scheme TerminalIPHONE \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Sign binary with ldid
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/TerminalIPHONE.app"
          ldid -S "$APP/TerminalIPHONE" || true

      - name: Package Roothide deb
        run: |
          set -e
          ROOT=deb_roothide
          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/var/jb/Applications" "$ROOT/var/jb/opt/terminal-iphone" "$ROOT/var/jb/usr/bin" "$ROOT/var/jb/usr/share/terminal-iphone" "$ROOT/var/jb/etc/apt/sources.list.d" "$ROOT/var/jb/var/mobile/terminal-iphone"
          cp -R "ios/build/Build/Products/Release-iphoneos/TerminalIPHONE.app" "$ROOT/var/jb/Applications/"
          cp -R app.js assets docs index.html manifest.webmanifest package.json scripts src styles.css sw.js tests "$ROOT/var/jb/opt/terminal-iphone/" 2>/dev/null || true
          cp scripts/bootstrap-iphone.sh "$ROOT/var/jb/opt/terminal-iphone/scripts/bootstrap-iphone.sh" 2>/dev/null || true
          cp scripts/bootstrap-iphone.sh "$ROOT/var/jb/usr/share/terminal-iphone/bootstrap-iphone.sh" 2>/dev/null || true
          cp packaging/terminal-iphone-launcher.sh "$ROOT/var/jb/usr/bin/terminal-iphone"
          chmod 755 "$ROOT/var/jb/usr/bin/terminal-iphone"
          echo "deb http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" > "$ROOT/var/jb/etc/apt/sources.list.d/terminal-iphone.list"
          cp packaging/control.roothide "$ROOT/DEBIAN/control"
          cp packaging/postinst.roothide "$ROOT/DEBIAN/postinst"
          chmod 755 "$ROOT/DEBIAN/postinst"
          chmod 755 "$ROOT/DEBIAN"
          # web clip
          cp packaging/webclip.mobileconfig "$ROOT/var/jb/opt/terminal-iphone/Terminal.mobileconfig" 2>/dev/null || true
          dpkg-deb --build --root-owner-group "$ROOT" terminal-iphone-app-roothide_1.0.0_iphoneos-arm64e.deb
          ls -lh *.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-iphone-app-roothide-deb
          path: "*.deb"