name: TerminalIPHONE
options:
  bundleIdPrefix: com.terminaliphone
  deploymentTarget:
    iOS: "14.0"
targets:
  TerminalIPHONE:
    type: application
    platform: iOS
    sources:
      - path: TerminalIPHONE
        excludes:
          - Resources
    resources:
      - path: TerminalIPHONE/Resources
    info:
      path: TerminalIPHONE/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.terminaliphone.app
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"